# Secret scan. Mirrors hello-aws so the two repositories fail the same way.
# GitHub's own secret scanning and push protection are on for this repository;
# gitleaks runs anyway because it catches different shapes and gates the PR.
name: "[sec] Secret scan"

on:
  # Unfiltered by path on purpose: a secret can be added to any file.
  pull_request:
  push:
    branches:
      - main

# Superseded revisions are cancelled: these jobs only read, so losing one
# costs nothing and a stale run gates nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Full history: a PR range needs both endpoints.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # PR: the commits it adds, each merge as its diff against the first
          # parent, so a conflict resolution is scanned too. Push: the branch's
          # first-parent history.
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            LOG_OPTS="--diff-merges=first-parent ${BASE_SHA}..${HEAD_SHA}"
          else
            LOG_OPTS="--first-parent ${GITHUB_SHA}"
          fi

          echo "scanning: ${LOG_OPTS}"

          # Exit 1 = findings or a fatal error, >1 = execution error. A run that
          # wrote no report scanned nothing, so it fails too.
          rc=0
          gitleaks git \
            --no-banner \
            --redact \
            --log-opts="${LOG_OPTS}" \
            --report-format json \
            --report-path gitleaks-report.json || rc=$?

          if [[ "$rc" -gt 1 ]]; then
            echo "::error::gitleaks failed to run (exit $rc) - nothing was scanned"
            exit 1
          fi

          if [[ ! -s gitleaks-report.json ]]; then
            echo "::error::gitleaks wrote no report (exit $rc) - nothing was scanned"
            exit 1
          fi
          count=$(jq 'length' gitleaks-report.json)
          if [[ "$count" -gt 0 ]]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID): \(.Description)"' gitleaks-report.json
            echo "::error::${count} potential secret(s) detected - see annotations above"
            exit 1
          fi

          echo "no secrets detected"
